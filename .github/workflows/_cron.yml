name: Javis Auto Corner Scanner

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Run Javis Corner Engine
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python javis_engine.py

      - name: Save Updated Matches JSON
        run: |
          git config user.name "Javis Bot"
          git config user.email "javis@users.noreply.github.com"
          git add matches.json history.json data/
          git diff --staged --quiet || git commit -m "Update Javis v3.0 data"
          git push
